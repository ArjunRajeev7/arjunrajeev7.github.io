<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Tracker — Fixed Deposits</title>
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="container">
    <div class="card-grid" id="summaryCards"></div>

    <div class="frame" id="addFrame">
      <div class="frame-head"><span class="title">add fixed deposit</span></div>
      <div class="frame-body">
        <div class="form-grid">
          <div class="form-field"><label>bank / issuer</label><input id="fdBank" placeholder="e.g. HDFC Bank" /></div>
          <div class="form-field"><label>principal (₹)</label><input id="fdPrincipal" type="number" step="any" /></div>
          <div class="form-field"><label>rate % p.a.</label><input id="fdRate" type="number" step="any" /></div>
          <div class="form-field"><label>start date</label><input id="fdStart" type="date" /></div>
          <div class="form-field"><label>tenure (months)</label><input id="fdTenure" type="number" step="1" /></div>
          <div class="form-field"><label>compounding</label>
            <select id="fdComp">
              <option value="quarterly">quarterly</option>
              <option value="monthly">monthly</option>
              <option value="yearly">yearly</option>
            </select>
          </div>
          <div class="form-field"><button id="addFdBtn">+ add</button></div>
        </div>
      </div>
    </div>

    <div class="frame" id="tableFrame"></div>

    <div class="frame">
      <div class="frame-head"><span class="title">maturity timeline</span></div>
      <div class="frame-body" id="timelineHolder"></div>
    </div>

    <div class="footer-note">finance tracker · data source: data/data.json · not investment advice</div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/market.js"></script>
  <script src="js/valuation.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/fixeddeposits.js"></script>
</body>
</html>
