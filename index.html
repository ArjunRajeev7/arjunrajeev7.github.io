<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Tracker — Dashboard</title>
<meta name="theme-color" content="#000000" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar" class="topbar"></div>
  <div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

  <div class="container">
    <div class="card-grid" id="summaryCards"></div>
    <div class="card-grid" id="diversityCards"></div>

    <div class="frame">
      <div class="frame-head"><span class="title">allocation by asset class</span></div>
      <div class="frame-body">
        <div style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
          <div id="donutHolder"></div>
          <div style="flex:1; min-width:260px;" id="allocTableHolder"></div>
        </div>
      </div>
    </div>

    <div class="frame">
      <div class="frame-head"><span class="title">top holdings by weight</span></div>
      <div class="frame-body" id="topHoldingsHolder"></div>
    </div>

    <div class="frame">
      <div class="frame-head"><span class="title">holdings — current value &amp; xirr</span></div>
      <div class="frame-body table-scroll">
        <table id="holdingsTable">
          <thead>
            <tr>
              <th>name</th><th>class</th><th>qty</th><th>invested</th><th>current</th>
              <th>gain</th><th>gain %</th><th>xirr</th>
            </tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </div>

    <div class="frame">
      <div class="frame-head"><span class="title">invested vs current — by asset class</span></div>
      <div class="frame-body">
        <div class="chart-box" id="barChart"></div>
      </div>
    </div>

    <div class="footer-note">finance tracker · data source: data/data.json · not investment advice</div>
  </div>

  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/market.js"></script>
  <script src="js/valuation.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
